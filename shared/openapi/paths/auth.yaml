register:
  post:
    operationId: register
    description: Registra una cuenta con correo electrónico y contraseña y devuelve los datos de sesión junto con un token de acceso. La contraseña debe tener entre 8 y 72 bytes. Responde 409 si el correo ya está registrado. Abre una sesión. En el web el refresh token llega en la cookie HttpOnly `refresh_token`; con `client` = `mobile`, en `refresh_token` del body.
    tags: [Autenticación]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegisterRequest'
    responses:
      '201':
        description: Usuario creado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResponse'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: El email ya está registrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

login:
  post:
    operationId: login
    description: Inicia sesión con correo electrónico y contraseña y devuelve un token de acceso para autenticar las demás rutas. Abre una sesión. En el web el refresh token llega en la cookie HttpOnly `refresh_token`; con `client` = `mobile`, en `refresh_token` del body.
    tags: [Autenticación]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginRequest'
    responses:
      '200':
        description: Login exitoso
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResponse'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: Credenciales inválidas
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: '`usuario suspendido`'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '429':
        description: '`demasiadas solicitudes` (límite por IP)'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

google:
  post:
    operationId: loginGoogle
    description: >-
      Inicia sesión con un ID token de Google. Si no existe una cuenta para esa
      identidad de Google, la vincula con la cuenta del mismo email (si Google es
      la autoridad del email) o crea una cuenta nueva. Responde 200 también cuando
      crea la cuenta; `created` distingue los dos casos. Abre una sesión. En
      el web el refresh token llega en la cookie HttpOnly `refresh_token`; con
      `client` = `mobile`, en `refresh_token` del body.
    tags: [Autenticación]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GoogleLoginRequest'
    responses:
      '200':
        description: Sesión iniciada (o cuenta creada, si `created` es true)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthResponse'
      '400':
        description: Datos inválidos (falta `id_token` o está vacío)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: '`token de Google inválido` o `email de Google no verificado`'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: '`este email de Google no se puede usar aquí; regístrate o inicia sesión con email y contraseña` o `usuario suspendido`'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: '`la cuenta ya está vinculada a otra cuenta de Google` o `esta cuenta no puede vincularse con Google; inicia sesión con tu contraseña`'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '413':
        description: El body es demasiado grande
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '429':
        description: '`demasiadas solicitudes` (límite por IP)'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '503':
        description: '`login con Google no configurado` o `login con Google no disponible`'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

me:
  get:
    operationId: me
    description: Devuelve los datos de la cuenta asociada al token de acceso y el nombre de su rol.
    tags: [Autenticación]
    responses:
      '200':
        description: Usuario autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioMeResponse'
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

refresh:
  post:
    operationId: refresh
    description: >-
      Renueva el token de acceso con el refresh token de la sesión y rota el
      refresh token (el anterior deja de servir). El web manda la cookie
      `refresh_token` sin body y recibe la cookie nueva; el móvil manda
      `refresh_token` en el body y recibe el nuevo en la respuesta. Si la
      sesión no es válida responde 401 y borra la cookie: hay que iniciar
      sesión de nuevo. Un error interno responde 500 y conserva la cookie. Si
      llegan body y cookie, gana el body.
    tags: [Autenticación]
    security: []
    parameters:
      - name: refresh_token
        in: cookie
        required: false
        description: Refresh token de una sesión web (cookie HttpOnly que pone el login).
        schema:
          type: string
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefreshRequest'
    responses:
      '200':
        description: Sesión renovada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResponse'
      '400':
        description: '`refresh_token` falta o está vacío en el body'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '413':
        description: El body es demasiado grande
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: '`sesión inválida o expirada`'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '429':
        description: '`demasiadas solicitudes` (límite por IP)'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

logout:
  post:
    operationId: logout
    description: >-
      Cierra la sesión actual: revoca su refresh token (de la cookie o del
      body) y borra la cookie. No pide token de acceso, que puede haber
      expirado, y responde 204 aunque la sesión no exista. El cliente debe
      descartar también el token de acceso.
    tags: [Autenticación]
    security: []
    parameters:
      - name: refresh_token
        in: cookie
        required: false
        description: Refresh token de una sesión web (cookie HttpOnly que pone el login).
        schema:
          type: string
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefreshRequest'
    responses:
      '204':
        description: Sesión cerrada
      '400':
        description: '`refresh_token` falta o está vacío en el body'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '413':
        description: El body es demasiado grande
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

recovery:
  post:
    operationId: solicitarRecuperacion
    security: []
    summary: Solicitud de recuperación de contraseña
    description: Envía un correo electrónico con un código de verificación para recuperar la contraseña del usuario.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth/recovery_request.yaml'
    responses:
      '202':
        description: Correo de recuperación aceptado.
      '400':
        description: Solicitud inválida.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '429':
        description: Demasiadas solicitudes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

verifyRecovery:
  post:
    operationId: verificarRecuperacion
    security: []
    summary: Verificación del código de recuperación
    description: Verifica el código de recuperación y devuelve un token de un solo uso para establecer la nueva contraseña.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth/verify_recovery_request.yaml'
    responses:
      '200':
        description: Código correcto.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRecoveryResponse'
      '400':
        description: Solicitud inválida o código de verificación incorrecto.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '429':
        description: Demasiadas solicitudes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

resetPassword:
  post:
    operationId: restablecerContrasena
    security: []
    summary: Establecer la nueva contraseña
    description: Cambia la contraseña con el token que devuelve la verificación del código. Invalida las sesiones anteriores.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth/reset_password_request.yaml'
    responses:
      '204':
        description: Contraseña cambiada exitosamente. Sin contenido.
      '400':
        description: Solicitud inválida o token inválido o expirado.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '429':
        description: Demasiadas solicitudes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    RegisterRequest:
      $ref: '../schemas/auth/register_request.yaml'
    LoginRequest:
      $ref: '../schemas/auth/login_request.yaml'
    AuthResponse:
      $ref: '../schemas/auth/auth_response.yaml'
    GoogleLoginRequest:
      $ref: '../schemas/auth/google_login_request.yaml'
    RefreshRequest:
      $ref: '../schemas/auth/refresh_request.yaml'
    GoogleAuthResponse:
      $ref: '../schemas/auth/google_auth_response.yaml'
    Usuario:
      $ref: '../schemas/auth/usuario.yaml'
    UsuarioMeResponse:
      $ref: '../schemas/auth/usuario_me_response.yaml'
    RecoveryRequest:
      $ref: '../schemas/auth/recovery_request.yaml'
    VerifyRecoveryRequest:
      $ref: '../schemas/auth/verify_recovery_request.yaml'
    VerifyRecoveryResponse:
      $ref: '../schemas/auth/verify_recovery_response.yaml'
    ResetPasswordRequest:
      $ref: '../schemas/auth/reset_password_request.yaml'
    ErrorResponse:
      $ref: '../schemas/error_response.yaml'
