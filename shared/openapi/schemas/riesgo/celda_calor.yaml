type: object
description: >-
  Celda de la cuadrícula del mapa de calor. Su punto es el promedio de la posición de sus reportes (no el
  centro de la celda), así que no se mueve al cambiar el zoom: un reporte solo queda siempre en su lugar.
required: [latitude, longitude, peso, reportes]
properties:
  latitude:
    type: number
    format: double
  longitude:
    type: number
    format: double
  peso:
    type: number
    format: double
    description: Suma del peso de los reportes históricos de la celda (ver backend/GUIA_RIESGO.md).
  reportes:
    type: integer
    description: Cuántos reportes cayeron en la celda.
