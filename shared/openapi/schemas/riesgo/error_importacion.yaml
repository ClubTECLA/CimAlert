type: object
description: >-
  El archivo tiene filas inválidas y no se importó nada. Se devuelven las primeras 100; total_errores dice cuántas
  hay en todo el archivo.
required: [message, total_errores, errores]
properties:
  message:
    type: string
  total_errores:
    type: integer
  errores:
    type: array
    items:
      $ref: '../../openapi.yaml#/components/schemas/ErrorFilaImportacion'
